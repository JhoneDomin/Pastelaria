<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pastelaria do Antonio</title>

<style>

body{
font-family:Arial;
background:#fff5e6;
margin:0;
}

header{
background:#ff7a00;
color:white;
text-align:center;
padding:20px;
font-size:28px;
}

.container{
padding:20px;
max-width:600px;
margin:auto;
}

.produto{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:15px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
display:flex;
justify-content:space-between;
align-items:center;
}

.produto-info{
flex:1;
}

.produto-info h3{
margin:0 0 5px 0;
}

.preco{
color:#ff3c00;
font-weight:bold;
}

input{
width:60px;
padding:5px;
}

button{
background:#25D366;
color:white;
border:none;
padding:15px;
font-size:18px;
border-radius:8px;
width:100%;
margin-top:20px;
cursor:pointer;
}

button:hover{
background:#1ebe5d;
}

.total{
font-size:20px;
font-weight:bold;
margin-top:20px;
text-align:center;
}

</style>

</head>

<body>

<header>
🥟 Pastelaria do Antonio
</header>

<div class="container">

<div class="produto">
<div class="produto-info">
<h3>Pastel de Carne</h3>
<span class="preco">R$ 8,00</span>
</div>
<input type="number" min="0" value="0" data-nome="Pastel de Carne" data-preco="8" onchange="calcularTotal()">
</div>

<div class="produto">
<div class="produto-info">
<h3>Pastel de Queijo</h3>
<span class="preco">R$ 7,00</span>
</div>
<input type="number" min="0" value="0" data-nome="Pastel de Queijo" data-preco="7" onchange="calcularTotal()">
</div>

<div class="produto">
<div class="produto-info">
<h3>Pastel de Frango</h3>
<span class="preco">R$ 8,00</span>
</div>
<input type="number" min="0" value="0" data-nome="Pastel de Frango" data-preco="8" onchange="calcularTotal()">
</div>

<div class="produto">
<div class="produto-info">
<h3>Pastel de Calabresa</h3>
<span class="preco">R$ 8,50</span>
</div>
<input type="number" min="0" value="0" data-nome="Pastel de Calabresa" data-preco="8.5" onchange="calcularTotal()">
</div>

<div class="total">Total: R$ 0,00</div>

<button onclick="enviarPedido()">Enviar Pedido pelo WhatsApp</button>

</div>

<script>

function calcularTotal(){
var inputs = document.querySelectorAll('input[type="number"]')
var total = 0
for(var i = 0; i < inputs.length; i++){
var qtd = parseInt(inputs[i].value) || 0
var preco = parseFloat(inputs[i].getAttribute('data-preco'))
total += qtd * preco
}
document.querySelector('.total').textContent = 'Total: R$ ' + total.toFixed(2).replace('.', ',')
}

function enviarPedido(){
var inputs = document.querySelectorAll('input[type="number"]')
var itens = []
var total = 0

for(var i = 0; i < inputs.length; i++){
var qtd = parseInt(inputs[i].value) || 0
if(qtd > 0){
var nome = inputs[i].getAttribute('data-nome')
var preco = parseFloat(inputs[i].getAttribute('data-preco'))
itens.push(qtd + 'x ' + nome + ' (R$ ' + (qtd * preco).toFixed(2).replace('.', ',') + ')')
total += qtd * preco
}
}

if(itens.length === 0){
alert('Selecione pelo menos um item!')
return
}

var mensagem = 'Olá, gostaria de fazer um pedido:\n\n' + itens.join('\n') + '\n\nTotal: R$ ' + total.toFixed(2).replace('.', ',')

var numero = "5585991923386"

var url = "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensagem)

window.open(url)

}

</script>

</body>
</html>
